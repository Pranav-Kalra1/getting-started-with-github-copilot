<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p class="loading">Loading activities...</p>

          <!-- Template for activity cards (client JS should clone/populate this) -->
          <template id="activity-template">
            <div class="activity-card">
              <h4 class="activity-name"><!-- name --></h4>
              <p class="activity-description"><!-- description --></p>
              <p class="activity-schedule"><strong>Schedule:</strong> <!-- schedule --></p>
              <p class="activity-capacity"><strong>Max participants:</strong> <!-- max --></p>

              <!-- Participants section (bulleted list) -->
              <div class="participants-section">
                <h5>Participants</h5>
                <ul class="participants-list">
                  <li class="no-participants">No participants yet.</li>
                  <!-- JS should replace the contents with <li><span class="participant-pill">initials</span> email@example.com</li> -->
                </ul>
              </div>
            </div>
          </template>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>

    <!-- Participants list with unregister functionality (for demonstration, this should be dynamically generated) -->
    <ul id="participants-list">
      <li>
        Participant Name <img src="delete-icon.png" alt="Delete" class="delete-icon" onclick="unregisterParticipant(this)" />
      </li>
      <!-- Repeat for other participants -->
    </ul>
    <script>
      function unregisterParticipant(element) {
        const participantItem = element.parentElement;
        participantItem.remove(); // Remove the participant from the list
      }
    </script>
  </body>
</html>
